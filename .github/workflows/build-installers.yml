name: Build native installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.0)
        required: false
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # jeepney lets the Linux tray D-Bus tests run; everything else is mocked.
      - run: python -m pip install ruff==0.15.17 jeepney
      - run: python -m unittest discover -s tests -v
      - run: ruff check wifi_agent.py install.py packaging/generate_assets.py tests/test_wifi_agent.py
      - name: Check shell scripts
        run: |
          shellcheck install.sh install-macos.sh packaging/linux/*.sh packaging/linux/wifi-agent \
            packaging/debian/build-deb.sh packaging/debian/postinst packaging/debian/prerm \
            packaging/arch/build-package.sh packaging/macos/*.sh packaging/macos/scripts/*

  windows:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $Version = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($Version) -and "${{ github.ref_type }}" -eq "tag") {
            $Version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ([string]::IsNullOrWhiteSpace($Version)) {
            $Version = (python -c "import wifi_agent; print(wifi_agent.APP_VERSION)").Trim()
          }
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Configure Windows signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $CertificateConfigured = -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)
          $PasswordConfigured = -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)
          if ($CertificateConfigured -ne $PasswordConfigured) {
            throw "Configure both Windows signing secrets or leave both unset."
          }
          if ($CertificateConfigured) {
            $CertificatePath = Join-Path $env:RUNNER_TEMP "wifi-agent-signing.pfx"
            [IO.File]::WriteAllBytes($CertificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            "WINDOWS_SIGNING_CERTIFICATE=$CertificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
            "WINDOWS_SIGNING_PASSWORD=$env:CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Warning "Windows signing secrets are not configured; publishing an unsigned installer."
          }
      - name: Build Windows installer
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -Version "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: WiFiAgent-Windows-x64
          path: build/windows/installer/*.exe
          if-no-files-found: error

  macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$REQUESTED_VERSION"
          if [[ -z "$VERSION" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION="$(python -c 'import wifi_agent; print(wifi_agent.APP_VERSION)')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Verify macOS GUI build support
        run: python -c 'import tkinter; print("Tcl/Tk", tkinter.Tcl().eval("info patch"))'
      - name: Configure Apple signing and notarization
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_SIGNING_IDENTITY: ${{ secrets.MACOS_APP_SIGNING_IDENTITY }}
          INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          CONFIGURED_VALUES=0
          for required in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD APP_SIGNING_IDENTITY INSTALLER_SIGNING_IDENTITY NOTARY_APPLE_ID NOTARY_PASSWORD NOTARY_TEAM_ID; do
            if [[ -n "${!required}" ]]; then
              CONFIGURED_VALUES=$((CONFIGURED_VALUES + 1))
            fi
          done
          if [[ "$CONFIGURED_VALUES" -ne 0 && "$CONFIGURED_VALUES" -ne 7 ]]; then
            echo "Configure all seven Apple signing/notarization secrets or leave all of them unset." >&2
            exit 1
          fi
          if [[ "$CONFIGURED_VALUES" -eq 0 ]]; then
            echo "::warning::Apple signing secrets are not configured; publishing an ad-hoc signed, unnotarized installer."
          fi
          if [[ -n "$CERTIFICATE_BASE64" ]]; then
            CERTIFICATE_PATH="$RUNNER_TEMP/wifi-agent-signing.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/wifi-agent-build.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            echo "MACOS_APP_SIGNING_IDENTITY=$APP_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "MACOS_INSTALLER_SIGNING_IDENTITY=$INSTALLER_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi
          if [[ -n "$NOTARY_APPLE_ID" && -n "$NOTARY_PASSWORD" && -n "$NOTARY_TEAM_ID" ]]; then
            xcrun notarytool store-credentials wifi-agent-ci \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$NOTARY_TEAM_ID"
            echo "APPLE_NOTARY_KEYCHAIN_PROFILE=wifi-agent-ci" >> "$GITHUB_ENV"
          fi
      - name: Build macOS installers
        run: ./packaging/macos/build-installer.sh "${{ steps.version.outputs.version }}"
      - name: Install the package and launch it through LaunchServices
        run: ./packaging/macos/verify-installer.sh build/macos/installer/*.pkg
      - uses: actions/upload-artifact@v7
        with:
          name: WiFiAgent-macOS-${{ matrix.architecture }}
          path: |
            build/macos/installer/*.pkg
            build/macos/installer/*.dmg
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$REQUESTED_VERSION"
          if [[ -z "$VERSION" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION="$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' wifi_agent.py)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate desktop entry
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate packaging/linux/wifi-agent.desktop
      - name: Build Debian/Ubuntu package
        run: ./packaging/debian/build-deb.sh "${{ steps.version.outputs.version }}" dist/linux
      - name: Build Arch Linux package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/linux
          docker run --rm -e VERSION -v "$PWD:/src" archlinux:latest bash -euc '
            pacman -Syu --noconfirm --needed base-devel git >/dev/null
            useradd -m builder
            cp -r /src /home/builder/src
            chown -R builder: /home/builder/src
            su builder -c "cd ~/src && sh packaging/arch/build-package.sh \"$VERSION\" /home/builder/out"
            cp /home/builder/out/*.pkg.tar.zst /home/builder/out/*.tar.gz /home/builder/out/PKGBUILD /home/builder/out/wifi-agent.install /src/dist/linux/
          '
          sudo chown -R "$(id -u):$(id -g)" dist/linux
      - name: Install and run the packages on supported distributions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in debian:12 ubuntu:22.04 ubuntu:24.04; do
            echo "::group::$image"
            docker run --rm -v "$PWD:/src:ro" "$image" sh -c \
              "/src/packaging/linux/smoke-test.sh /src/dist/linux/wifi-agent_${VERSION}_all.deb"
            echo "::endgroup::"
          done
          echo "::group::archlinux"
          docker run --rm -v "$PWD:/src:ro" archlinux:latest sh -c \
            "pacman -Sy --noconfirm >/dev/null && /src/packaging/linux/smoke-test.sh /src/dist/linux/wifi-agent-${VERSION}-1-any.pkg.tar.zst"
          echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        with:
          name: WiFiAgent-Linux
          path: dist/linux/*
          if-no-files-found: error

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            RELEASE_TITLE="WiFi Agent ${GITHUB_REF_NAME#v}"
            NOTES_FILE=".github/release-notes/$RELEASE_TAG.md"
            if [[ -f "$NOTES_FILE" ]]; then
              CREATE_ARGUMENTS=(--verify-tag --notes-file "$NOTES_FILE")
            else
              CREATE_ARGUMENTS=(--verify-tag --generate-notes)
            fi
          else
            VERSION="$REQUESTED_VERSION"
            RELEASE_TAG="installer-build-${GITHUB_RUN_NUMBER}"
            RELEASE_TITLE="WiFi Agent $VERSION installers (build ${GITHUB_RUN_NUMBER})"
            CREATE_ARGUMENTS=(--target "$GITHUB_SHA" --prerelease --notes "Direct installer downloads from workflow run ${GITHUB_RUN_NUMBER}.")
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TITLE" "${CREATE_ARGUMENTS[@]}"
          fi

          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          echo "### Direct installer downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "Installers are attached individually at [$RELEASE_TITLE]($RELEASE_URL); no ZIP extraction is required." >> "$GITHUB_STEP_SUMMARY"
